# Publishes the new/ folder to GitHub Pages on every push to main.
name: Deploy site
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: new
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: Set custom domain
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -sS -w "\nHTTP %{http_code}\n" -X PUT \
            -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/pages" \
            -d '{"cname":"rrjetiagency.com"}'
          curl -sS -H "Authorization: Bearer $GH_TOKEN" "https://api.github.com/repos/${{ github.repository }}/pages"
